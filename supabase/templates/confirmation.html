<!doctype html>
<html lang="en"><body>
  <h1>Confirm your email</h1>
  <p>Confirm your Would You Peek account to start saving training sessions.</p>
  {{ if or (eq .RedirectTo .SiteURL) (eq .RedirectTo "") }}
  <p><a href="{{ .SiteURL }}/auth/confirm?next=/library&amp;token_hash={{ .TokenHash }}&amp;type=signup">Confirm email</a></p>
  {{ else }}
  <p><a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=signup">Confirm email</a></p>
  {{ end }}
  <p>If you did not request this, you can ignore this email.</p>
</body></html>
